[project]
name = "duckscope"
version = "0.1.0"
description = "Local-first DuckDB data viewer"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.3",
  "fastapi>=0.115",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
